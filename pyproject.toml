[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedev-gnn"
version = "0.1.0"
description = "Federated Graph Neural Networks for Intrusion Detection in Connected Electric Mobility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow",
    "numpy",
]

[project.scripts]
fedgnn-data = "fedgnn.data.cli:main"

[project.optional-dependencies]
eda = [
    "pandas",
    "matplotlib",
    "seaborn",
    "ipykernel",
    "jupyterlab",
]
gnn = [
    "torch",
    "torch-geometric",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:version"
]



