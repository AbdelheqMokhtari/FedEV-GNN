name: lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install linters
        run: pip install black==24.4.2 isort==5.13.2 flake8==7.0.0

      - name: black
        run: black --check .

      - name: isort
        run: isort --check .

      - name: flake8
        run: flake8 --max-line-length=88 --extend-ignore=E203,W503 .
